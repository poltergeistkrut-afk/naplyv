  else if(S&&S.over){S.t+=dt;S.shake*=.9;S.pt.forEach(function(o){o.x+=o.vx*dt;o.y+=o.vy*dt;o.l-=dt});S.pt=S.pt.filter(function(o){return o.l>0})}
  hud();draw();requestAnimationFrame(loop);
}
document.addEventListener('visibilitychange',function(){for(var k in KEY)KEY[k]=0;stick.on=0;if(document.hidden)pauseG()});

$('mu').onclick=function(){mute=!mute;this.textContent=mute?'🔇':'🔊';this.blur()};
init3d();size();showStart();requestAnimationFrame(loop);
})();
